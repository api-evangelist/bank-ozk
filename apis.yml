description: Bank OZK is a regional bank headquartered in Little Rock, Arkansas, tracing
  its charter to 1903 and today operating roughly 265 offices across Arkansas, Georgia,
  Florida, North Carolina, Texas, and New York. It is a state-chartered commercial
  bank and the wholly owned subsidiary of Bank OZK holding company, publicly traded
  on the Nasdaq Global Select Market under the symbol OZK, with about $40.8 billion
  in total assets as of year-end 2025 and a national reputation in commercial real
  estate lending. Bank OZK runs no first-party public developer portal and publishes
  no downloadable OpenAPI/Swagger specifications; it is not a documented Financial
  Data Exchange (FDX) participant and has not published a specific CFPB Section 1033
  data-access posture. Consumer-permissioned account data is reached only indirectly
  through third-party aggregators, with Plaid documented as the supporting aggregator.
  This is an honest identity-only profile with no public API surface.
